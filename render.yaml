services:
  - type: web
    name: multi-agent-aiops-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AIOPS_TRACE_DIR
        value: /tmp/aiops-traces
      - key: GROQ_RETRY_MAX_ATTEMPTS
        value: "2"
      - key: GROQ_RETRY_WAIT_BUDGET_SECONDS
        value: "25"
      - key: GROQ_MAX_COMPLETION_TOKENS
        value: "1000"
